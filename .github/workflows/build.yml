name: Build & Publish

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, user, ticket, order, pay]
    steps:
      - name: Checkout carrier
        uses: actions/checkout@v4
        with:
          repository: nageoffer/12306
          path: carrier

      - name: Checkout build files
        uses: actions/checkout@v4
        with:
          path: rerail

      - name: Build ${{ matrix.service }}
        run: |
          cp rerail/build/Dockerfile carrier/
          cd carrier
          docker build \
            --build-arg SERVICE=${{ matrix.service }} \
            -t $REGISTRY/$OWNER/12306-${{ matrix.service }}:${{ github.ref_name }} \
            .

      - name: Push to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin
          docker push $REGISTRY/$OWNER/12306-${{ matrix.service }}:${{ github.ref_name }}

  verify:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Pull and smoke test
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin
          docker run -d --name smoke -p 8080:9000 \
            $REGISTRY/$OWNER/12306-gateway:${{ github.ref_name }}
          sleep 30
          curl -sf http://localhost:8080/actuator/health | grep -o '"status":"UP"' || exit 1
          docker rm -f smoke
