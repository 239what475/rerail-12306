# role builder：观测面（Prometheus/Grafana/Zipkin）+ k6 压测物料
# builder 本机即 Ansible 控制端（connection local 亦可，走 ssh 保持一致）
---
- name: 部署目录
  ansible.builtin.file:
    path: "{{ rerail_root }}/deploy/observability"
    state: directory

- name: 观测栈 compose
  ansible.builtin.template:
    src: compose-observability.yml.j2
    dest: "{{ rerail_root }}/deploy/observability/compose.yml"
    mode: "0644"

- name: Prometheus 抓取配置（目标 = 四台源端节点）
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ rerail_root }}/deploy/observability/prometheus.yml"
    mode: "0644"

- name: Grafana 数据源
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../deploy/observability/grafana-datasources.yml"
    dest: "{{ rerail_root }}/deploy/observability/grafana-datasources.yml"
    mode: "0644"

- name: Grafana dashboard JSON
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../deploy/observability/grafana-dashboard.json"
    dest: "{{ rerail_root }}/deploy/observability/grafana-dashboard.json"
    mode: "0644"

# 坑位：bind mount 数据目录默认 root 属主，容器内进程是 nobody(65534)/grafana(472) → 起不来
- name: 数据目录属主（prometheus=nobody, grafana=472）
  ansible.builtin.file:
    path: "{{ rerail_root }}/deploy/observability/{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0755"
  loop:
    - { path: prom-data, owner: "65534", group: "65534" }
    - { path: grafana-data, owner: "472", group: "472" }

- name: 启动观测栈
  ansible.builtin.command: docker compose -p rerail-observability up -d --pull missing
  args:
    chdir: "{{ rerail_root }}/deploy/observability"
  register: compose_up
  changed_when: "'Started' in compose_up.stdout or 'Created' in compose_up.stdout or 'Recreated' in compose_up.stdout"

- name: 等待 Grafana 3000 就绪
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 3000
    timeout: 120

- name: 导入 Grafana dashboard（API，幂等 overwrite）
  ansible.builtin.uri:
    url: http://localhost:3000/api/dashboards/db
    method: POST
    user: admin
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ lookup('file', playbook_dir + '/../deploy/observability/grafana-dashboard.json') }}"
    status_code: [200]

- name: k6 压测物料
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../load-test/"
    dest: "{{ rerail_root }}/loadtest/"
    mode: preserve
