# 10 · Gateway Deployment + Service（入口，Spring Cloud Gateway）
# OTel：由 Instrumentation CR + annotation 注入（不在 YAML 里配置）
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: rerail
  labels: { app: gateway }
  annotations:
    instrumentation.opentelemetry.io/inject-java: "true"
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
      annotations:
        instrumentation.opentelemetry.io/inject-java: "true"
    spec:
      serviceAccountName: rerail-sa
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: <ACR_REGISTRY>/12306-gateway:otel
          ports:
            - containerPort: 9000
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
              value: "nacos.rerail:8848"
            - name: SPRING_DATA_REDIS_HOST
              value: dbproxy-haproxy.rerail
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_DATA_REDIS_PASSWORD
              value: "123456"
            # Redisson 默认 connectionPoolSize=64 —— 900 RPS 实测打满 + pending 118（Redis 服务端仅 41 ops/s、CPU 0.2%，非服务端瓶颈）
            # 经 spring.data.redis.redisson.config 整体注入放大（starter 官方属性，免改代码）
            - name: SPRING_DATA_REDIS_REDISSON_CONFIG
              value: '{"singleServerConfig":{"address":"redis://dbproxy-haproxy.rerail:6379","password":"123456","connectionMinimumIdleSize":32,"connectionPoolSize":256,"subscriptionConnectionMinimumIdleSize":16,"subscriptionConnectionPoolSize":128,"idleConnectionTimeout":30000,"connectTimeout":10000,"timeout":3000,"retryAttempts":3,"retryInterval":1500},"threads":16,"nettyThreads":32}'
            # SB2 风格属性双保险（3.21.3 starter 两代 autoconfig 并存，绑哪个不确定）
            - name: SPRING_REDIS_REDISSON_CONFIG
              value: '{"singleServerConfig":{"address":"redis://dbproxy-haproxy.rerail:6379","password":"123456","connectionMinimumIdleSize":32,"connectionPoolSize":256,"subscriptionConnectionMinimumIdleSize":16,"subscriptionConnectionPoolSize":128,"idleConnectionTimeout":30000,"connectTimeout":10000,"timeout":3000,"retryAttempts":3,"retryInterval":1500},"threads":16,"nettyThreads":32}'
            - name: JAVA_OPTS
              value: "-Dfile.encoding=UTF-8 -javaagent:/otel/opentelemetry-javaagent.jar -Xms256m -Xmx512m"
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { cpu: "1", memory: 1Gi }
          livenessProbe:
            tcpSocket: { port: 9000 }
            initialDelaySeconds: 180
            periodSeconds: 15
            failureThreshold: 10
          readinessProbe:
            tcpSocket: { port: 9000 }
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: rerail
spec:
  selector: { app: gateway }
  ports:
    - port: 9000
      targetPort: 9000
