metadata:
  name: dbproxy-haproxy
  namespace: rerail
  labels:
    helm.sh/chart: haproxy-1.30.2
    app.kubernetes.io/name: haproxy
    app.kubernetes.io/instance: dbproxy
    app.kubernetes.io/version: "3.4.4"
    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: true

---
# Source: haproxy/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: dbproxy-haproxy
  namespace: rerail
  labels:
    helm.sh/chart: haproxy-1.30.2
    app.kubernetes.io/name: haproxy
    app.kubernetes.io/instance: dbproxy
    app.kubernetes.io/version: "3.4.4"
    app.kubernetes.io/managed-by: Helm
data:
  haproxy.cfg: |+
  
    global
      log stdout format raw local0
      maxconn 4096
      stats socket *:9999 level admin
    
    defaults
      log global
      mode tcp
      timeout connect 5s
      timeout client 30s
      timeout server 30s
      option tcplog
    
    listen redis_backend
      bind *:6379
      server redis-server redis.rerail:6379 check inter 2s fall 3 rise 2
    
    listen mysql_backend
      bind *:3306
      server mysql-server mysql.rerail:3306 check inter 2s fall 3 rise 2
    

---
# Source: haproxy/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: "dbproxy-haproxy"
  namespace: rerail
  labels:
    helm.sh/chart: haproxy-1.30.2
    app.kubernetes.io/name: haproxy
    app.kubernetes.io/instance: dbproxy
    app.kubernetes.io/version: "3.4.4"
    app.kubernetes.io/managed-by: Helm
  annotations:
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: haproxy
    app.kubernetes.io/instance: dbproxy
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: http
  - name: https
    protocol: TCP
    port: 443
    targetPort: https
  - name: stat
    protocol: TCP
    port: 1024
    targetPort: stat
  - name: admin
    protocol: TCP
    port: 9999
    targetPort: admin
  - name: mysql
    protocol: TCP
    port: 3306
    targetPort: mysql
  - name: redis
    protocol: TCP
    port: 6379
    targetPort: redis

---
# Source: haproxy/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbproxy-haproxy
  namespace: rerail
  labels:
    helm.sh/chart: haproxy-1.30.2
    app.kubernetes.io/name: haproxy
    app.kubernetes.io/instance: dbproxy
    app.kubernetes.io/version: "3.4.4"
    app.kubernetes.io/managed-by: Helm
  annotations:
spec:
  minReadySeconds: 0
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: haproxy
      app.kubernetes.io/instance: dbproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haproxy
        app.kubernetes.io/instance: dbproxy
      annotations:
        checksum/environment: 27167ca1cb09dd27bed80732d9f7672f8c64c583a144e598ba9b4ee80b409397
    spec:
      serviceAccountName: dbproxy-haproxy
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 60
      securityContext:
        {}
      dnsPolicy: ClusterFirst
      volumes:
        - name: haproxy-config
          configMap:
            name: dbproxy-haproxy
      containers:
        - name: haproxy
          image: "<ACR_REGISTRY>/12306-haproxy:2.9"
          imagePullPolicy: IfNotPresent
          args:
            - -f
            - /usr/local/etc/haproxy/haproxy.cfg
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: stat
              containerPort: 1024
              protocol: TCP
            - containerPort: 6379
              name: redis
              protocol: TCP
            - containerPort: 3306
              name: mysql
              protocol: TCP
            - containerPort: 9999
              name: admin
              protocol: TCP
          livenessProbe:
            initialDelaySeconds: 5
            periodSeconds: 10
            tcpSocket:
              port: 6379
          readinessProbe:
            initialDelaySeconds: 3
            periodSeconds: 5
            tcpSocket:
              port: 6379
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: haproxy-config
              mountPath: /usr/local/etc/haproxy
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: haproxy
              topologyKey: kubernetes.io/hostname
            weight: 100
