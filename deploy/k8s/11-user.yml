# 11 · user Service（ShardingSphere 4 分库 128 分表）
# 分片配置内嵌于 ss-user ConfigMap（真内容，SS 配置漂移事故后终结占位符）
apiVersion: v1
kind: ConfigMap
metadata:
  name: ss-user
  namespace: rerail
data:
  shardingsphere.yaml: |
    dataSources:
      ds_0:
        dataSourceClassName: com.zaxxer.hikari.HikariDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        jdbcUrl: jdbc:mysql://dbproxy-haproxy.rerail:3306/12306_user_0?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
        username: root
        password: root

      ds_1:
        dataSourceClassName: com.zaxxer.hikari.HikariDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        jdbcUrl: jdbc:mysql://dbproxy-haproxy.rerail:3306/12306_user_1?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
        username: root
        password: root

    rules:
      - !SHARDING
        tables:
          t_user:
            actualDataNodes: ds_${0..1}.t_user_${0..31}
            databaseStrategy:
              standard:
                shardingColumn: username
                shardingAlgorithmName: user_database_hash_mod
            tableStrategy:
              standard:
                shardingColumn: username
                shardingAlgorithmName: user_table_hash_mod
          t_passenger:
            actualDataNodes: ds_${0..1}.t_passenger_${0..31}
            databaseStrategy:
              standard:
                shardingColumn: username
                shardingAlgorithmName: passenger_database_hash_mod
            tableStrategy:
              standard:
                shardingColumn: username
                shardingAlgorithmName: passenger_table_hash_mod
          t_user_mail:
            actualDataNodes: ds_${0..1}.t_user_mail_${0..31}
            databaseStrategy:
              standard:
                shardingColumn: mail
                shardingAlgorithmName: t_user_mail_database_hash_mod
            tableStrategy:
              standard:
                shardingColumn: mail
                shardingAlgorithmName: t_user_mail_table_hash_mod
          t_user_phone:
            actualDataNodes: ds_${0..1}.t_user_phone_${0..31}
            databaseStrategy:
              standard:
                shardingColumn: phone
                shardingAlgorithmName: t_user_phone_database_hash_mod
            tableStrategy:
              standard:
                shardingColumn: phone
                shardingAlgorithmName: t_user_phone_table_hash_mod
        shardingAlgorithms:
          user_database_hash_mod:
            type: CLASS_BASED
            props:
              sharding-count: 32
              table-sharding-count: 16
              strategy: standard
              algorithmClassName: org.opengoofy.index12306.framework.starter.database.algorithm.sharding.CustomDbHashModShardingAlgorithm
          passenger_database_hash_mod:
            type: CLASS_BASED
            props:
              sharding-count: 32
              table-sharding-count: 16
              strategy: standard
              algorithmClassName: org.opengoofy.index12306.framework.starter.database.algorithm.sharding.CustomDbHashModShardingAlgorithm
          t_user_mail_database_hash_mod:
            type: CLASS_BASED
            props:
              sharding-count: 32
              table-sharding-count: 16
              strategy: standard
              algorithmClassName: org.opengoofy.index12306.framework.starter.database.algorithm.sharding.CustomDbHashModShardingAlgorithm
          t_user_phone_database_hash_mod:
            type: CLASS_BASED
            props:
              sharding-count: 32
              table-sharding-count: 16
              strategy: standard
              algorithmClassName: org.opengoofy.index12306.framework.starter.database.algorithm.sharding.CustomDbHashModShardingAlgorithm
          passenger_table_hash_mod:
            type: HASH_MOD
            props:
              sharding-count: 32
          t_user_mail_table_hash_mod:
            type: HASH_MOD
            props:
              sharding-count: 32
          t_user_phone_table_hash_mod:
            type: HASH_MOD
            props:
              sharding-count: 32
          user_table_hash_mod:
            type: HASH_MOD
            props:
              sharding-count: 32
      - !ENCRYPT
        tables:
          t_user:
            columns:
              id_card:
                cipherColumn: id_card
                encryptorName: common_encryptor
              phone:
                cipherColumn: phone
                encryptorName: common_encryptor
              mail:
                cipherColumn: mail
                encryptorName: common_encryptor
              address:
                cipherColumn: address
                encryptorName: common_encryptor
          t_passenger:
            columns:
              id_card:
                cipherColumn: id_card
                encryptorName: common_encryptor
              phone:
                cipherColumn: phone
                encryptorName: common_encryptor
            queryWithCipherColumn: true
        encryptors:
          common_encryptor:
            type: AES
            props:
              aes-key-value: d6oadClrrb9A3GWo
    props:
      sql-show: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: rerail
  labels:
    app: user
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
      annotations:
        instrumentation.opentelemetry.io/inject-java: 'true'
    spec:
      serviceAccountName: rerail-sa
      terminationGracePeriodSeconds: 30
      containers:
      - name: user
        image: <ACR_REGISTRY>/12306-user:otel
        ports:
        - containerPort: 9001
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:shardingsphere:absolutepath:/app/config/shardingsphere.yaml
        - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
          value: nacos.rerail:8848
        - name: SPRING_DATA_REDIS_HOST
          value: dbproxy-haproxy.rerail
        - name: SPRING_DATA_REDIS_PORT
          value: '6379'
        - name: SPRING_DATA_REDIS_PASSWORD
          value: '123456'
        - name: SPRING_DATA_REDIS_REDISSON_CONFIG
          value: '{"singleServerConfig":{"address":"redis://dbproxy-haproxy.rerail:6379","password":"123456","connectionMinimumIdleSize":32,"connectionPoolSize":256,"subscriptionConnectionMinimumIdleSize":16,"subscriptionConnectionPoolSize":128,"idleConnectionTimeout":30000,"connectTimeout":10000,"timeout":3000,"retryAttempts":3,"retryInterval":1500},"threads":16,"nettyThreads":32}'
        - name: SPRING_REDIS_REDISSON_CONFIG
          value: '{"singleServerConfig":{"address":"redis://dbproxy-haproxy.rerail:6379","password":"123456","connectionMinimumIdleSize":32,"connectionPoolSize":256,"subscriptionConnectionMinimumIdleSize":16,"subscriptionConnectionPoolSize":128,"idleConnectionTimeout":30000,"connectTimeout":10000,"timeout":3000,"retryAttempts":3,"retryInterval":1500},"threads":16,"nettyThreads":32}'
        - name: JAVA_OPTS
          value: -Dfile.encoding=UTF-8 -javaagent:/otel/opentelemetry-javaagent.jar -Xms512m -Xmx768m
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 1536Mi
        volumeMounts:
        - name: shardingsphere
          mountPath: /app/config
        livenessProbe:
          tcpSocket:
            port: 9001
          initialDelaySeconds: 180
          periodSeconds: 15
          failureThreshold: 10
        readinessProbe:
          tcpSocket:
            port: 9001
          initialDelaySeconds: 90
          periodSeconds: 10
          failureThreshold: 6
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - sleep 10
      volumes:
      - name: shardingsphere
        configMap:
          name: ss-user
---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: rerail
spec:
  selector:
    app: user
  ports:
  - port: 9001
    targetPort: 9001
