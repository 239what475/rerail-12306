# 05 · Zipkin Deployment（traces 后端，终态从 builder 迁入 K8s）
# 镜像：ACR/12306-zipkin:3
# 终端点：zipkin.rerail:9411（OTel spans 上报地址）
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: rerail
  labels: { app: zipkin }
spec:
  replicas: 1
  selector:
    matchLabels: { app: zipkin }
  template:
    metadata:
      labels: { app: zipkin }
    spec:
      serviceAccountName: rerail-sa
      containers:
        - name: zipkin
          image: <ACR_REGISTRY>/12306-zipkin:3
          ports:
            - containerPort: 9411
          env:
            - name: STORAGE_TYPE
              value: "mem"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"
          resources:
            requests: { cpu: 100m, memory: 768Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            httpGet: { path: /api/v2/services, port: 9411 }
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: rerail
spec:
  selector: { app: zipkin }
  ports:
    - port: 9411
      targetPort: 9411
